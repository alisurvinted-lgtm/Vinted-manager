name: Déployer sur GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  configure:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pages: read
      contents: read
    outputs:
      base_path: ${{ steps.pages.outputs.base_path }}
    steps:
      - name: Vérifier le dépôt autorisé et le mode gratuit
        env:
          CURRENT_REPOSITORY_ID: ${{ github.repository_id }}
          REPO_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [ "$CURRENT_REPOSITORY_ID" != "1459243181" ]; then
            echo "::error::Ce workflow autorise uniquement le dépôt existant identifié par 1459243181."
            exit 1
          fi
          if [ "$REPO_PRIVATE" != "false" ]; then
            echo "Le déploiement gratuit prévu requiert un dépôt public. Aucune visibilité n’a été modifiée."
            exit 1
          fi
      - name: Vérifier l’adresse demandée
        env:
          CURRENT_NAME: ${{ github.event.repository.name }}
        run: |
          if [ "${CURRENT_NAME,,}" != "vinted-manager" ]; then
            echo "::error::Nom actuel : $CURRENT_NAME. Dans Settings > General > Repository name, renommez ce même dépôt en vinted-manager, puis relancez le workflow."
            exit 1
          fi
      - name: Configurer Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: false
      - name: Vérifier le chemin Pages
        env:
          ACTUAL_BASE: ${{ steps.pages.outputs.base_path }}
        run: |
          NORMALIZED_BASE="${ACTUAL_BASE,,}"
          if [ "${NORMALIZED_BASE%/}" != "/vinted-manager" ]; then
            echo "::error::Le chemin Pages ne correspond pas à /vinted-manager/. Le déploiement est arrêté."
            exit 1
          fi
  build:
    needs: configure
    if: github.ref == 'refs/heads/main' && github.repository_id == 1459243181 && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PAGES_BASE_PATH: ${{ needs.configure.outputs.base_path }}/
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify:source
      - name: Vérifier les dépendances
        run: npm audit --audit-level=moderate
      - run: npm test
      - name: Compiler et vérifier les fichiers publiables
        run: npm run build
      - name: Compiler le prototype du client personnel validé
        run: npm run gmail:build
      - name: Installer les navigateurs de test
        run: npx playwright install --with-deps chromium webkit
      - name: Tester la confidentialité, la restauration, Pages et le mode hors ligne
        run: npm run test:e2e
      - name: Tester le prototype Gmail sans autorisation ni message réel
        run: npm run gmail:test:browser
      - name: Assembler uniquement les fichiers statiques vérifiés
        run: npm run pages:package
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: .pages-build
          retention-days: 1
  deploy:
    needs: [configure, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
