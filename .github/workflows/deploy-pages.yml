name: Déployer sur GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  configure:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      contents: read
    outputs:
      base_path: ${{ steps.pages.outputs.base_path }}
    steps:
      - name: Vérifier le dépôt et le mode gratuit
        env:
          CURRENT_REPOSITORY: ${{ github.repository }}
          REPO_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [ "$CURRENT_REPOSITORY" != "alisurvinted-lgtm/vinted-manager" ]; then
            echo "::error::Renommez le dépôt existant en vinted-manager pour respecter l’adresse demandée, puis relancez ce workflow. Aucun second dépôt n’est nécessaire."
            exit 1
          fi
          if [ "$REPO_PRIVATE" != "false" ]; then
            echo "Le déploiement gratuit prévu requiert un dépôt public. Aucune visibilité n’a été modifiée."
            exit 1
          fi
      - name: Configurer Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: true
  build:
    needs: configure
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify:source
      - name: Vérifier les dépendances
        run: npm audit --audit-level=moderate
      - run: npm test
      - name: Compiler et vérifier les fichiers publiables
        env:
          PAGES_BASE_PATH: ${{ needs.configure.outputs.base_path }}/
        run: npm run build
      - name: Installer les navigateurs de test
        run: npx playwright install --with-deps chromium webkit
      - name: Tester la confidentialité, la restauration, Pages et le mode hors ligne
        env:
          PAGES_BASE_PATH: ${{ needs.configure.outputs.base_path }}/
        run: npm run test:e2e
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist
          retention-days: 1
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
